<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gramofon logosu: ahşap kutu, plak, boru (pirinç) -->
  <defs>
    <linearGradient id="pirinc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d58a"/>
      <stop offset=".5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8f6420"/>
    </linearGradient>
    <linearGradient id="ahsap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6334"/>
      <stop offset="1" stop-color="#5c3517"/>
