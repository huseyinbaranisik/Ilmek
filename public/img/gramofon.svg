  </defs>
  <!-- Boru -->
  <path d="M41 37 C38 29 28 19 9 9 L5 25 C20 27 32 33 38 40 Z" fill="url(#pirinc)"/>
  <ellipse cx="7" cy="17" rx="3.2" ry="8.4" transform="rotate(12 7 17)" fill="#6e4a15"/>
  <!-- Boyun -->
  <path d="M39 39 L44 47" stroke="#c99235" stroke-width="3" stroke-linecap="round"/>
  <!-- Plak -->
  <ellipse cx="33" cy="48" rx="20" ry="4" fill="#111"/>
  <ellipse cx="33" cy="48" rx="5" ry="1.2" fill="#e3913f"/>
  <!-- Ahşap kutu -->
  <rect x="11" y="49" width="44" height="11" rx="2" fill="url(#ahsap)"/>
  <rect x="15" y="53" width="36" height="1.4" fill="#3d220e" opacity=".5"/>
